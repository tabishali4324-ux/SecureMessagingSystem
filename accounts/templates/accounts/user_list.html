{% extends "accounts/base.html" %}
{% block title %}Users{% endblock %}
{% block content %}
            <h1>users</h1>
            {% for u in users %}
            <p><a href="{% url 'send_message' u.username %}">{{ u.username }}</a></p>
            {% empty %}
            <p class="subtitle">No other users yet</p>
            {% endfor %}
{% endblock %}
