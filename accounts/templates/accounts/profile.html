{% extends "accounts/base.html" %}
{% block title %}Profile{% endblock %}
{% block content %}

    <h1>My Profile</h1>
    <p class="subtitle">Username: {{request.user.username}}</p>

    <form method="post">
        {% csrf_token %}
        <div class="input-group">
            <label for="age">Age</label>
            <input type="number" id="age" name="age" value="{{ profile.age }}">

        </div>
        <button type="submit">Update Age</button>
    </form>
{% endblock %}
